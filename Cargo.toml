[package]
name = "nexrepo-cli"
version = "0.1.0"
edition = "2024"
description = "Zero vendor lock-in. Multi-provider Git workflow tool."


# CRITICAL: Optimize for minimal binary size
[profile.release]
opt-level = "z"   # Optimize for size
lto = true        # Link Time Optimization
codegen-units = 1 # Better compression
panic = "abort"   # Smaller binary (removes unwinding info)
strip = true      # Strip debugging symbols

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
indicatif = "0.18.4"
inquire = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
